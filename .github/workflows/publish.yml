name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it to your repository secrets before releasing."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          if ! npm whoami --registry https://registry.npmjs.org/ 2>&1; then
            echo "::error::npm authentication failed. The NPM_TOKEN may be expired, revoked, or missing publish permissions."
            exit 1
          fi
          echo "npm auth OK — token is valid."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check version consistency
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          MCP_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "CLI version:  $CLI_VERSION"
          echo "MCP version:  $MCP_VERSION"
          echo "Tag version:  $TAG_VERSION"

          if [ "$CLI_VERSION" != "$MCP_VERSION" ]; then
            echo "::error::Version mismatch: @aura-forge/cli is $CLI_VERSION but @aura-forge/mcp is $MCP_VERSION. Bump both to the same version before releasing."
            exit 1
          fi

          if [ "$CLI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json files say $CLI_VERSION but the git tag is $GITHUB_REF_NAME. Ensure both package.json files match the tag version."
            exit 1
          fi

          echo "Version check passed — both packages are at $CLI_VERSION and match the tag."

      - name: Build CLI
        run: pnpm --filter @aura-forge/cli run build

      - name: Build MCP
        run: pnpm --filter @aura-forge/mcp run build

      # Both builds must succeed before either package is published.
      # If either step above fails, the job stops here and nothing is published.

      - name: Publish CLI
        run: pnpm --filter @aura-forge/cli publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP
        run: pnpm --filter @aura-forge/mcp publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
